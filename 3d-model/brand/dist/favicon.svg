<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Philly3D favicon: simplified City Hall tower, bold enough to read at 16px.
       Ink plate, bronze tower, paper clock face (the lit clock). -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#171512"/>
  <g fill="#c89b5e">
    <!-- penn: crisp rects so the hat survives the 16px grid -->
    <rect x="26.5" y="7.4" width="11" height="2"/>
    <rect x="29.4" y="4.2" width="5.2" height="3.2" rx="1.2"/>
    <path d="M 28.6 9.4 L 35.4 9.4 L 36.6 17 L 27.4 17 Z"/>
    <!-- apex block and dome -->
    <rect x="26" y="17" width="12" height="2.6"/>
    <path d="M 26.4 19.6 C 25.4 24 22.8 27.2 20.6 29.6 L 43.4 29.6 C 41.2 27.2 38.6 24 37.6 19.6 Z"/>
    <!-- cornice, clock block -->
    <rect x="16.5" y="29.6" width="31" height="2.8"/>
    <rect x="18.5" y="32.4" width="27" height="15.8"/>
    <!-- ledge and shaft -->
    <rect x="16.5" y="48.2" width="31" height="2.8"/>
    <rect x="20" y="51" width="24" height="8.4"/>
  </g>
  <!-- paper clock face with ink hands -->
  <circle cx="32" cy="40.3" r="7.2" fill="#efe9dc"/>
  <g fill="#171512">
    <rect x="31.2" y="35.2" width="1.6" height="5.4"/>
    <path d="M 32 39.5 L 36 41.7 L 35.2 43.1 L 31.3 40.9 Z"/>
    <circle cx="32" cy="40.3" r="1.2"/>
  </g>
</svg>
