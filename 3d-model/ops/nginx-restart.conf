# systemd drop-in for nginx. Install as
#   /etc/systemd/system/nginx.service.d/restart.conf   (mkdir -p the directory;
#   it does not exist on the box yet)
# then
#   systemctl daemon-reload
#   systemctl show nginx -p Restart -p RestartUSec     (expect on-failure / 30s)
#
# Why: the Aug 27 outage was nginx failing ONE startup config test (DNS for the
# /adsb upstream was unavailable while systemd-resolved was being upgraded) and
# never being retried — nine hours dark for all three sites on the box. The
# vhost fix (resolver + variable upstream, see philly3d.vhost.example) removes
# that particular cause; this drop-in is the second belt for any transient
# failure of any cause: a failed start or a crash is retried every 30 s,
# forever. StartLimitIntervalSec=0 disables the "start request repeated too
# quickly" lockout that would otherwise give up after five tries in ten seconds.
# It does NOT paper over a genuinely broken config — nginx would just fail every
# 30 s, loudly, in the journal — so `nginx -t` before every reload stays the rule.

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30
