<!doctype html>
<meta charset="utf-8">
<title>Cloud Shader Checks</title>
<style>body{background:#141a20;color:#eae9e5;font:14px/1.5 monospace;padding:24px}canvas{width:384px;height:240px}pre{white-space:pre-wrap}</style>
<h1>Cloud Shader Checks</h1>
<p>Runs the actual app shader with desktop and touch sample budgets, with logarithmic and standard depth. Serve 3d-model and open /tests/clouds_gpu.html.</p>
<pre id="result">Running…</pre>
<script src="../three.min.js"></script>
<script>
(async () => {
  const source = await (await fetch('../app.js', {cache:'no-store'})).text();
  const banks = source.slice(source.indexOf('  // World-space cloud banks'), source.indexOf('  // ---- low-poly cloud field'));
  const inverse = source.slice(source.indexOf('  const INV_GLSL ='), source.indexOf('  // materials that opt out'));
  const create = new Function('THREE', 'isTouch', 'camera', 'scene', 'skyMat', 'postU', inverse + banks + '\nreturn {cloudMat, cloudDeck, CLOUD_LAYERS};');
  const results = [];
  const check = (ok, label) => { if (!ok) throw new Error(label); };
  for (const touch of [false, true]) for (const logarithmicDepthBuffer of [true, false]) {
    const renderer = new THREE.WebGLRenderer({antialias:false, logarithmicDepthBuffer});
    renderer.setSize(256,160); renderer.setClearColor(0,0);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65,256/160,0.1,26000);
    const uniforms = {uCloud:{value:.7},uCloudLight:{value:1},uCloudOff:{value:new THREE.Vector2()},uSun:{value:new THREE.Vector3(.3,.8,-.4).normalize()},cSun:{value:new THREE.Color(1,1,1)}};
    const {cloudMat,cloudDeck,CLOUD_LAYERS} = create(THREE,touch,camera,scene,{uniforms},{uPost:{value:0},uExposure:{value:1.06}});
    const target = new THREE.WebGLRenderTarget(256,160);
    const pixels = new Uint8Array(256*160*4);
    const pose = (height,pitch,x=-2200,z=500) => {
      camera.position.set(x,height,z); camera.lookAt(x,height+Math.sin(pitch)*1000,z-Math.cos(pitch)*1000);
      camera.updateMatrixWorld(); cloudDeck.position.copy(camera.position);
    };
    const render = () => {
      renderer.setRenderTarget(target); renderer.render(scene,camera);
      renderer.readRenderTargetPixels(target,0,0,256,160,pixels);
      const copy = pixels.slice();
      renderer.setRenderTarget(null); renderer.render(scene,camera);
      return copy;
    };
    const count = data => {let n=0;for(let i=3;i<data.length;i+=4) if(data[i]>2)n++;return n;};
    pose(400,.48); const below=count(render()); check(below>100,'Clouds missing from below');
    pose(1450,.05); const inside=count(render()); check(inside>100,'Clouds missing within lower band');
    pose(1600,-.35); const down=count(render()); check(down>100,'Lower clouds missing when looking down');
    pose(400,-1.1); check(count(render())===0,'Clouds incorrectly drawn below their altitude bands');
    pose(5500,1.1); check(count(render())===0,'Clouds incorrectly drawn above their altitude bands');
    pose(400,.48); uniforms.uCloud.value=0; check(count(render())===0,'Zero weather cover still draws clouds');
    uniforms.uCloud.value=.08; const clear=count(render());
    uniforms.uCloud.value=.92; const overcast=count(render()); check(overcast>clear,'Overcast does not increase cloud coverage');
    uniforms.uCloud.value=.7; const fixed=render(), repeat=render();
    check(fixed.every((v,i)=>v===repeat[i]),'Clouds change with a stationary camera and frozen wind');
    // A wall immediately in front of the camera must fully hide distant clouds.
    const wall=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshBasicMaterial({color:0xff0000}));
    wall.quaternion.copy(camera.quaternion);
    wall.position.copy(camera.position).add(new THREE.Vector3(0,0,-10).applyQuaternion(camera.quaternion));
    scene.add(wall); const occluded=render(); let wrong=0;
    for(let i=0;i<occluded.length;i+=4) if(occluded[i]!==255||occluded[i+1]||occluded[i+2])wrong++;
    check(wrong===0,'Clouds bleed through foreground geometry');
    wall.scale.setScalar(2000);
    wall.position.copy(camera.position).add(new THREE.Vector3(0,0,-18000).applyQuaternion(camera.quaternion));
    const distant=render(); let veiled=0;
    for(let i=0;i<distant.length;i+=4) if(distant[i+1]>3||distant[i+2]>3)veiled++;
    check(veiled>100,'Clouds fail to veil geometry behind them');
    scene.remove(wall);
    // Probe the production density function in a vertical slice through both bands.
    const fragment=cloudMat.fragmentShader;
    const sample=(l)=>`cloudSample(p, vec4(${l.base.toFixed(1)},${l.spread.toFixed(1)},${l.thickness.toFixed(1)},${l.seed.toFixed(1)}), ${l.scale.toFixed(7)}, ${l.wind.toFixed(2)}, .7, 0.0, 0.0).x`;
    cloudMat.fragmentShader=fragment.slice(0,fragment.lastIndexOf('      void main() {'))+`void main() {vec3 p=vec3(gl_FragCoord.x/256.0*12000.0-6000.0,gl_FragCoord.y/160.0*5000.0,500.0);gl_FragColor=vec4(${sample(CLOUD_LAYERS[0])},${sample(CLOUD_LAYERS[1])},0.0,1.0);}`;
    cloudMat.needsUpdate=true;
    const slice=render(),bases=[]; let highBank=0;
    for(let x=0;x<256;x++)for(let y=0;y<160;y++)if(slice[(y*256+x)*4]>3){bases.push((y+.5)/160*5000);break;}
    for(let y=96;y<160;y++)for(let x=0;x<256;x++)if(slice[(y*256+x)*4+1]>3)highBank++;
    const baseSpread=Math.round(Math.max(...bases)-Math.min(...bases));
    check(bases.length>10&&baseSpread>300,'Cloud bases collapse to a shared flat altitude');
    check(highBank>100,'Independent upper cloud band is missing');
    cloudMat.fragmentShader=fragment;cloudMat.needsUpdate=true;
    check(renderer.info.programs.every(p=>!p.diagnostics||p.diagnostics.runnable),'Shader compilation failed');
    results.push({touch,logarithmicDepthBuffer,steps:CLOUD_LAYERS.map(l=>l.steps),below,inside,down,clear,overcast,foregroundErrors:wrong,veiled,baseSpread,highBank});
    target.dispose();wall.geometry.dispose();wall.material.dispose();cloudMat.dispose();cloudDeck.geometry.dispose();renderer.dispose();renderer.forceContextLoss();
  }
  document.getElementById('result').textContent='PASS\n'+JSON.stringify(results,null,2);
  console.log('CLOUD_GPU_PASS '+JSON.stringify(results));
})().catch(error=>{document.getElementById('result').textContent='FAIL: '+error.stack;console.error('CLOUD_GPU_FAIL',error);});
</script>
